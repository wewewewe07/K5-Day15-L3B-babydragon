# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
#
# Người dùng A3 là người DUYỆT kịch bản bài giảng (giảng viên / đội sản xuất), không phải học viên.
# 1 phiên = duyệt 1 kịch bản bài giảng. 1 lượt = đưa 1 đoạn kịch bản (~6–8 câu khẳng định) vào answer().
# Kiểm chéo với spec.md §2: cơ sở 12 người × (0.5×4 + 0.3×3 + 0.2×2) = ~40 kịch bản / tháng,
# nằm trong khoảng 30–45 kịch bản / tháng ở §2.
# Cập nhật lại số người, số phiên, số lượt sau khi có phỏng vấn đội sản xuất (evidence/interviews/).

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người duyệt bài giảng nếu đưa vào dùng — 3 kịch bản
  low: 10
  base: 12
  high: 15
  source: "spec.md §2: ~10–15 người trong đội sản xuất bài giảng và giảng viên (tự ước tính); cơ sở 12 lấy giữa khoảng (tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: giang_vien_soan_bai_moi
    share: 0.5              # giảng viên soạn và duyệt bài mới của buổi mình dạy
    uses_per_month: 4       # 1 bài / tuần (repo đề, tracks/track-a-edtech.md, mục persona A3)
    turns_per_session: 6    # nhiều lượt: kịch bản 30–50 câu (spec.md §1), chia đoạn 6–8 câu
    source: "uses: repo đề tracks/track-a-edtech.md 'A3: soạn 1 bài / tuần (nhiều lượt)'; turns: (tự ước tính) từ kịch bản 30–50 câu ở spec.md §1"
  - name: doi_san_xuat_duyet_dinh_ky
    share: 0.3              # thành viên đội sản xuất duyệt bài theo module
    uses_per_month: 3
    turns_per_session: 4
    source: "(tự ước tính) từ spec.md §2: 30–45 kịch bản / tháng chia cho 10–15 người"
  - name: phu_trach_soat_bai_cu
    share: 0.2              # người phụ trách nội dung soát lại bài cũ
    uses_per_month: 2
    turns_per_session: 2    # ít lượt, mỗi lượt token rất lớn
    source: "repo đề tracks/track-a-edtech.md 'soát bài cũ (ít lượt, token rất lớn)'; số phiên, số lượt: (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: claude-haiku-5-5
    input: 0.10
    output: 0.50
    source: "Claude Haiku 5.5 (tầng Nhỏ) · https://platform.claude.com/docs/en/about-claude/pricing · BTC xem 25/11/2026 (further-reading/model-prices.md)"
  - model: claude-sonnet-5-5
    input: 2.00
    output: 10.00
    source: "Claude Sonnet 5.5 (tầng Lớn) · https://platform.claude.com/docs/en/about-claude/pricing · BTC xem 25/11/2026 (further-reading/model-prices.md)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
