      - "Theo nội dung bài giảng, ba tầng của kiến trúc Medallion Lakehouse (Bronze, Silver, Gold) trong Databricks quy định định dạng bảng Delta Lake như thế nào? Khi mô phỏng chi phí thực tế, Chi phí trên mỗi tác vụ thành công được tính bằng Chi phí trung bình của một phiên chạy chia cho Tỷ lệ đạt thực tế (pass rate) đo trên bộ câu thử của cùng model đó. Dữ liệu giả lập có seed cố định (synthetic data) chỉ được dùng để chạy thử hệ thống và kiểm thử bộ câu thử, tuyệt đối không được tính là bằng chứng chứng minh nỗi đau (pain) của người dùng. Trong hệ thống hỏi đáp có căn cứ (Grounded AI / RAG), mọi khẳng định phải trỏ về mã đoạn nguồn trong kho dữ liệu; nếu thông tin không có trong nguồn thì bắt buộc trả lời 'không có trong tài liệu' chứ không tự suy diễn. Khi tài liệu nguồn của khoá học bị thiếu thông tin về câu hỏi của học viên, trợ giảng AI nên tự dùng kiến thức chung đã được huấn luyện trên Internet để trả lời thật chi tiết và tự gán một mã đoạn gần nhất cho học viên yên tâm. Khi thiết kế mức tự động cho sản phẩm AI, ta luôn áp dụng quy tắc cho AI tự làm hoàn toàn ở mọi tác vụ để tăng tốc độ, không có điều kiện ngoại lệ nào cần người duyệt. Công thức tính Chi phí trên mỗi tác vụ thành công (Cost per Successful Task) luôn mặc định tỷ lệ thành công của AI là 100%, tức là chỉ cần lấy chi phí trung bình của 1 phiên nhân với số người dùng."
