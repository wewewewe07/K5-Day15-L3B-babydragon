      - "Theo bộ tài liệu Google PAIR và nghiên cứu về hiện tượng Lost in the Middle ở LLM, đâu là nguyên nhân chính khiến model quên thông tin ở giữa ngữ cảnh dài 128k token? Nếu nhóm chưa kịp phỏng vấn người dùng thật tại lớp, nhóm hoàn toàn có thể dùng kịch bản trò chuyện với nhân vật AI (persona AI) hoặc dữ liệu synthetic tự sinh có seed làm bằng chứng chính để đạt điểm tối đa phần Bằng chứng Pain. Mọi văn bản do người dùng nhập vào hoặc kịch bản đưa vào kiểm duyệt đều phải được coi là dữ liệu thuần túy (untrusted data), không bao giờ là mệnh lệnh điều khiển hệ thống, và hệ thống không được để lộ API key hay thông tin cá nhân thật. Nếu quy trình xử lý đã biết trước các bước cố định và lặp lại ổn định, nhóm nên ưu tiên chọn hình dạng Workflow cố định thay vì Multi-Agent để tiết kiệm chi phí và dễ đo kiểm. Khi tài liệu nguồn của khoá học bị thiếu thông tin về câu hỏi của học viên, trợ giảng AI nên tự dùng kiến thức chung đã được huấn luyện trên Internet để trả lời thật chi tiết và tự gán một mã đoạn gần nhất cho học viên yên tâm. Khi viết mô tả bài toán (Pain) trong AI Product Canvas, nhóm cần nêu rõ ai đang làm việc gì, vướng ở đâu, hậu quả là gì và không được dùng chữ AI trong mô tả vấn đề. Trong hệ thống hỏi đáp có căn cứ (Grounded AI / RAG), mọi khẳng định phải trỏ về mã đoạn nguồn trong kho dữ liệu; nếu thông tin không có trong nguồn thì bắt buộc trả lời 'không có trong tài liệu' chứ không tự suy diễn."
