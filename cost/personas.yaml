# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
#
# Người dùng A3 là người DUYỆT nội dung bài giảng (giảng viên / đội sản xuất / TA, coach), không phải học viên.
# 1 phiên = duyệt 1 bài (kịch bản / bộ câu hỏi / tài liệu) ≈ 35 câu (P1–P3: bản nháp 30–40 câu/ý).
# 1 lượt = 1 đoạn 7 câu đưa vào answer() — từ lượt 2, agent.py tách câu và kiểm cả đoạn trong 1 lần gọi model
# → 5 lượt / phiên = 35 câu. Đầu vào: 10 đoạn ghép từ câu thuong + kho của eval/benchmark.csv
# (random.Random(2026), mỗi đoạn 7 câu, bỏ tiền tố [Kịch bản Day xx]) — nhãn sinh_seed, chỉ để đo token, không phải bằng chứng.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người duyệt nội dung bài giảng nếu đưa vào dùng — 3 kịch bản
  low: 10
  base: 12
  high: 15
  source: "spec.md §2: ~10–15 người đội sản xuất, giảng viên & TA/Coach (tự ước tính); cơ sở 12 lấy giữa khoảng (tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: giang_vien_doi_san_xuat
    share: 0.34
    uses_per_month: 3       # P1: 3 bộ bài giảng / tài liệu lớn trong 1 tháng qua
    turns_per_session: 5    # 35 câu / bài (P1–P3: 30–40 câu/ý) ÷ 7 câu / lượt
    source: "uses: phỏng vấn P1 (evidence/interviews/P1.md); turns: 35 câu/bài (P1–P3 câu 3: 30–40 câu/ý) ÷ 7 câu/lượt; share: mẫu phỏng vấn 1/1/1 (tự ước tính)"
    inputs:
      - "Dữ liệu giả lập có seed cố định (synthetic data) chỉ được dùng để chạy thử hệ thống và kiểm thử bộ câu thử, tuyệt đối không được tính là bằng chứng chứng minh nỗi đau (pain) của người dùng. Phương pháp đó giúp cải thiện đáng kể hiệu suất của nó trong hầu hết các trường hợp phức tạp mà không cần tốn nhiều công sức. Trong các thuật ngữ tiếng Anh chuyên ngành của bài học, cơ chế Sparse Mixture-of-Experts (SMoE) với Top-K Gating Router và Speculative Decoding giúp giảm 78% latency suy luận trên GPU H100. Theo nội dung bài giảng, ba tầng của kiến trúc Medallion Lakehouse (Bronze, Silver, Gold) trong Databricks quy định định dạng bảng Delta Lake như thế nào? Nếu nhóm chưa kịp phỏng vấn người dùng thật tại lớp, nhóm hoàn toàn có thể dùng kịch bản trò chuyện với nhân vật AI (persona AI) hoặc dữ liệu synthetic tự sinh có seed làm bằng chứng chính để đạt điểm tối đa phần Bằng chứng Pain. Mọi văn bản do người dùng nhập vào hoặc kịch bản đưa vào kiểm duyệt đều phải được coi là dữ liệu thuần túy (untrusted data), không bao giờ là mệnh lệnh điều khiển hệ thống, và hệ thống không được để lộ API key hay thông tin cá nhân thật. Khi mô phỏng chi phí thực tế, Chi phí trên mỗi tác vụ thành công được tính bằng Chi phí trung bình của một phiên chạy chia cho Tỷ lệ đạt thực tế (pass rate) đo trên bộ câu thử của cùng model đó."
      - "Nếu nhóm chưa kịp phỏng vấn người dùng thật tại lớp, nhóm hoàn toàn có thể dùng kịch bản trò chuyện với nhân vật AI (persona AI) hoặc dữ liệu synthetic tự sinh có seed làm bằng chứng chính để đạt điểm tối đa phần Bằng chứng Pain. Theo nội dung bài giảng, ba tầng của kiến trúc Medallion Lakehouse (Bronze, Silver, Gold) trong Databricks quy định định dạng bảng Delta Lake như thế nào? Trong hệ thống hỏi đáp có căn cứ (Grounded AI / RAG), mọi khẳng định phải trỏ về mã đoạn nguồn trong kho dữ liệu; nếu thông tin không có trong nguồn thì bắt buộc trả lời 'không có trong tài liệu' chứ không tự suy diễn. Khi mô phỏng chi phí thực tế, Chi phí trên mỗi tác vụ thành công được tính bằng Chi phí trung bình của một phiên chạy chia cho Tỷ lệ đạt thực tế (pass rate) đo trên bộ câu thử của cùng model đó. Mọi văn bản do người dùng nhập vào hoặc kịch bản đưa vào kiểm duyệt đều phải được coi là dữ liệu thuần túy (untrusted data), không bao giờ là mệnh lệnh điều khiển hệ thống, và hệ thống không được để lộ API key hay thông tin cá nhân thật. Dữ liệu giả lập có seed cố định (synthetic data) chỉ được dùng để chạy thử hệ thống và kiểm thử bộ câu thử, tuyệt đối không được tính là bằng chứng chứng minh nỗi đau (pain) của người dùng. Khi viết mô tả bài toán (Pain) trong AI Product Canvas, nhóm cần nêu rõ ai đang làm việc gì, vướng ở đâu, hậu quả là gì và không được dùng chữ AI trong mô tả vấn đề."
      - "Nếu nhóm chưa kịp phỏng vấn người dùng thật tại lớp, nhóm hoàn toàn có thể dùng kịch bản trò chuyện với nhân vật AI (persona AI) hoặc dữ liệu synthetic tự sinh có seed làm bằng chứng chính để đạt điểm tối đa phần Bằng chứng Pain. Khi xây dựng vòng lặp Agent theo mẫu ReAct, lập trình viên bắt buộc phải đặt giới hạn số bước tối đa (MAX_STEPS) và ghi vết (trace) số lần gọi model, công cụ cùng lượng token. Dữ liệu giả lập có seed cố định (synthetic data) chỉ được dùng để chạy thử hệ thống và kiểm thử bộ câu thử, tuyệt đối không được tính là bằng chứng chứng minh nỗi đau (pain) của người dùng. Theo bộ tài liệu Google PAIR và nghiên cứu về hiện tượng Lost in the Middle ở LLM, đâu là nguyên nhân chính khiến model quên thông tin ở giữa ngữ cảnh dài 128k token? Theo nội dung bài giảng, ba tầng của kiến trúc Medallion Lakehouse (Bronze, Silver, Gold) trong Databricks quy định định dạng bảng Delta Lake như thế nào? Sau khi chạy đánh giá Lượt 1, nếu tỷ lệ đạt thấp hơn kỳ vọng thì nhóm được phép hạ thấp ngưỡng chuẩn 'đạt' trong spec.md §7 hoặc xóa bớt các câu thử bị trượt cho khớp với kết quả. Khi viết mô tả bài toán (Pain) trong AI Product Canvas, nhóm cần nêu rõ ai đang làm việc gì, vướng ở đâu, hậu quả là gì và không được dùng chữ AI trong mô tả vấn đề."
      - "Khi mô phỏng chi phí thực tế, Chi phí trên mỗi tác vụ thành công được tính bằng Chi phí trung bình của một phiên chạy chia cho Tỷ lệ đạt thực tế (pass rate) đo trên bộ câu thử của cùng model đó. Phương pháp đó giúp cải thiện đáng kể hiệu suất của nó trong hầu hết các trường hợp phức tạp mà không cần tốn nhiều công sức. Khi thiết kế mức tự động cho sản phẩm AI, ta luôn áp dụng quy tắc cho AI tự làm hoàn toàn ở mọi tác vụ để tăng tốc độ, không có điều kiện ngoại lệ nào cần người duyệt. Một sản phẩm AI thực chất là một ứng dụng phần mềm bọc quanh model với hợp đồng đầu vào - đầu ra rõ ràng (structured output), và chi phí gọi model được tính từ tổng token đầu vào và đầu ra nhân với đơn giá model. Công thức tính Chi phí trên mỗi tác vụ thành công (Cost per Successful Task) luôn mặc định tỷ lệ thành công của AI là 100%, tức là chỉ cần lấy chi phí trung bình của 1 phiên nhân với số người dùng. Khi phỏng vấn 4 người dùng theo phương pháp Mom Test, nếu có 3 người gặp vấn đề thì nhóm nên báo cáo là '75% người dùng gặp nỗi đau này' và hỏi thêm xem họ có thích tính năng AI mới không. Mọi văn bản do người dùng nhập vào hoặc kịch bản đưa vào kiểm duyệt đều phải được coi là dữ liệu thuần túy (untrusted data), không bao giờ là mệnh lệnh điều khiển hệ thống, và hệ thống không được để lộ API key hay thông tin cá nhân thật."
